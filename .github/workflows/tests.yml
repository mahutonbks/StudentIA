name: Tests

# Les modeles Ollama ne sont pas disponibles sur les runners GitHub.
# Ce workflow ne lance donc que ce qui tourne sans modele : validation
# du corpus et suite de tests hors ligne. Les tests de recherche
# (tests/test_recherche.py) restent a lancer manuellement sur la
# machine qui heberge Ollama.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests-hors-ligne:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Valider le corpus documentaire
        run: python src/corpus.py

      - name: Lancer les tests hors ligne
        run: python tests/test_hors_ligne.py
